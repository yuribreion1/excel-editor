name: Build & Deploy Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      create_prerelease:
        description: 'Create a pre-release on GitHub Releases'
        type: boolean
        default: false

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    outputs:
      vsix_name: ${{ steps.package.outputs.vsix_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package extension (production build + VSIX)
        id: package
        run: |
          npx @vscode/vsce package --no-dependencies
          VSIX_FILE=$(ls *.vsix | head -1)
          echo "vsix_name=${VSIX_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: '*.vsix'
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: package.json has '${PKG_VERSION}' but tag is '${GITHUB_REF_NAME}' (expected 'v${PKG_VERSION}')"
            exit 1
          fi
          echo "Version validated: ${PKG_VERSION}"

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: '*.vsix'
          generate_release_notes: true

  manual-release:
    name: Create Manual Pre-release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.create_prerelease == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-${{ github.run_number }}
          name: Pre-release (run ${{ github.run_number }})
          draft: false
          prerelease: true
          files: '*.vsix'
          generate_release_notes: false

  publish-marketplace:
    name: Publish to VS Code Marketplace
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for publisher token
        id: check_token
        run: |
          if [ -z "${{ secrets.VSCE_PAT }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VSCE_PAT secret is not configured. Skipping Marketplace publish."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Marketplace
        if: steps.check_token.outputs.has_token == 'true'
        run: npx @vscode/vsce publish --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
